name: Verify NEKO Survivors React
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      host_revision:
        description: Exact NEKO host commit SHA
        default: ''
        type: string
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/package.yml
    with:
      host_revision: ${{ inputs.host_revision }}
