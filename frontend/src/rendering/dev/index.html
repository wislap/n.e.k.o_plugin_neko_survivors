<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NEKO 视觉夹具 · 非游戏验收</title>
<style>
html,body,#stage{margin:0;width:100%;height:100%;overflow:hidden;background:#101d2b;color:#edf5ff;font:13px sans-serif}#controls{position:absolute;z-index:10;left:12px;right:12px;top:8px;padding:8px 12px;background:#102232eb;border:1px solid #72b2d0;border-radius:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}select,button{background:#25485a;border:1px solid #8bb8c8;color:white;padding:5px 9px;border-radius:4px}#warning{color:#ffdb91}#diagnostics{position:absolute;bottom:8px;left:12px;z-index:10;background:#0b1b28e8;padding:6px;max-width:95vw;font:11px monospace;white-space:pre-wrap;pointer-events:none}details{position:absolute;bottom:8px;left:12px;z-index:10;background:#0b1b28e8;padding:8px;border-radius:6px;max-width:95vw}details #diagnostics{position:static;display:block;max-height:45vh;overflow:auto;pointer-events:auto}summary{cursor:pointer}#stage canvas{width:100%;height:100%}
</style></head><body data-visual-fixture="true"><div id="stage"></div><div id="controls"><strong id="warning">开发视觉夹具：不运行规则、不证明通关</strong><label>场景 <select id="scene" aria-label="视觉场景"></select></label><button id="stage-next">下一阶段</button><button id="pause">暂停动画</button><label>玩家特效 <input id="opacity" aria-label="玩家特效透明度" type="range" min="0" max="100" value="100"></label><button id="lose-context">丢失当前 GPU 上下文</button><button id="restore-context" disabled>恢复 WebGL2 上下文</button><button id="fixture-loop">有限长跑（34场）</button><span id="context-status" role="status">上下文：正常</span><span id="backend">正在创建 GPU 渲染器…</span></div><details><summary>显示诊断与预期</summary><output id="diagnostics">等待初始化</output></details><script type="module" src="./main.ts"></script></body></html>
