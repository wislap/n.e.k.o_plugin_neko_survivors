[project]
name = "neko_survivors_react"
version = "0.4.18"
description = "猫娘姐妹：幸存者 —— 自带完整游戏的弹幕生存肉鸽"
requires-python = ">=3.11"
# 前端由 React/TypeScript/PixiJS 构建为静态资源；Python 端无外部运行依赖。
dependencies = []

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.neko.build]
exclude = ["protocol/host-revision.txt"]
exclude_dirs = ["frontend", "scripts", "tests", "node_modules", "test-results", "static/vendor"]
